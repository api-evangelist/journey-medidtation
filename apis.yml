aid: journey-medidtation
name: Journey Medidtation
description: >-
  Journey (Journey Meditation) is a workplace mental health platform that
  delivers preventive Employee Assistance Program (EAP) services to enterprise
  organizations. Rather than the reactive model of traditional EAPs, Journey
  uses AI-powered risk detection (Journey Signal) to identify emerging mental
  health issues before they escalate and connects employees to clinicians
  across 190+ countries in 100+ languages. Its offerings include Journey
  Proactive EAP, the Journey LIVE guided-meditation and wellbeing experience,
  and a Mental Health Certification training program. The company was surfaced
  as a portfolio company of Canaan Partners and added to the API Evangelist
  network. No public developer or API surface has been found; this profile is
  maintained as a company lead and refreshed by the enrichment pipeline.
